[pytest]
asyncio_mode = auto
testpaths = tests
# Integration tests hit real external things (Anthropic API, MCP server
# subprocesses) and are excluded by default.
# Run them explicitly with:  pytest -m integration -o addopts=""
addopts = -m "not integration"
markers =
    integration: hits real external dependencies (Anthropic API / MCP server subprocesses)

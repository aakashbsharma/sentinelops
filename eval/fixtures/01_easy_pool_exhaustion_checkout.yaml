# EASY / unambiguous. The alert names the symptom (DB timeouts) and the
# simulated world (scenario) contains textbook pool-exhaustion evidence.
id: easy_pool_exhaustion_checkout
title: "checkout-api: database connection timeouts spiking"
description: >
  PagerDuty alert: checkout-api p99 latency degraded from ~180ms to >4s over
  the last 15 minutes. Application logs show database timeout errors.
  Checkout conversion dropping. On-call paged.
source: eval
raw_payload:
  scenario: connection_pool_exhaustion
  alert_name: CheckoutApiDbTimeouts
  service: checkout-api
  environment: production
  fired_at: "2026-07-15T14:02:00Z"
  metric_snapshot:
    latency_p99_ms: 4310
    error_rate_pct: 11.8
    requests_per_s: 240
ground_truth:
  expected_severity: high
  expected_category: database
  expected_root_cause_keywords:
    - database connection pool exhausted
    - connections not being released
    - pool size limit reached
    - queries waiting to acquire a connection
  expected_risk_level: medium
  should_require_approval: true
  is_actually_critical: false
